[project]
name = "rncrn8"
version = "0.2.0"
description = "Personas with separated, provenance-tagged memory that travels across sessions, tools and models."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Mishal Alshomary" }]
keywords = ["llm", "personas", "review", "memory", "calibration", "mcp", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "anthropic>=2.5,<3",
    "click>=8.1",
    "mcp>=2.3,<3",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Mishallic/rncrn8"
Issues = "https://github.com/Mishallic/rncrn8/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rncrn8 = "rncrn8.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rncrn8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
