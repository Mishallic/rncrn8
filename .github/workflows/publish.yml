name: publish to PyPI

# Runs when a GitHub release is published. PyPI trusted publishing: no token is stored anywhere;
# PyPI must first list this repository and workflow as a trusted publisher for the rncrn8 project.
# Actions are pinned to commit SHAs, with the release they came from in a comment;
# .github/dependabot.yml proposes updates.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: the release tag must match the package and plugin versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          plug=$(python -c "import json; print(json.load(open('plugin/.claude-plugin/plugin.json'))['version'])")
          echo "tag=$tag package=$pkg plugin=$plug"
          test "$tag" = "$pkg" && test "$pkg" = "$plug"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
