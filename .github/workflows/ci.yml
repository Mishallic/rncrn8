name: tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      # the install path a user takes: build the wheel, install it fresh, and run the commands
      - run: python -m pip install build
      - run: python -m build --wheel --outdir wheelhouse
      - run: python -m venv smoke
      - name: install the wheel and run it (POSIX)
        if: runner.os != 'Windows'
        run: |
          smoke/bin/python -m pip install wheelhouse/*.whl
          smoke/bin/rncrn8 --version
          smoke/bin/rncrn8 --help
      - name: install the wheel and run it (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = Get-ChildItem wheelhouse/*.whl | Select-Object -First 1
          smoke\Scripts\python -m pip install $wheel.FullName
          smoke\Scripts\rncrn8 --version
          smoke\Scripts\rncrn8 --help
